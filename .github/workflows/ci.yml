name: Verify Pact

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:privacy-browser
      - run: npm run test:notifications-browser
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: deno check --frozen --config supabase/functions/profile-photo/deno.json supabase/functions/profile-photo/index.ts
      - run: deno check --frozen --config supabase/functions/dispatch-notifications/deno.json supabase/functions/dispatch-notifications/index.ts
      - run: deno test --frozen --allow-env --config supabase/functions/dispatch-notifications/deno.json supabase/functions/dispatch-notifications/dispatch.test.ts
